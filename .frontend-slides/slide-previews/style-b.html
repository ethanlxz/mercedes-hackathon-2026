<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swiss Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --stage-bg:#111; --slide-bg:#f6f5f0; --ink:#111; --red:#ff3300; --blue:#0a65d8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg)}.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg)}.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg)}.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg)}.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}img,video,canvas,svg{max-width:100%;max-height:100%}.deck-controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000}@media print{html,body{width:1920px;height:auto;overflow:visible;background:#fff}.deck-viewport{position:static;overflow:visible;background:#fff}.deck-stage{position:static;width:auto;height:auto;transform:none!important;background:none}.slide{position:relative;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;width:1920px;height:1080px;break-after:page;page-break-after:always}.slide:last-child{break-after:auto;page-break-after:auto}.deck-controls{display:none!important}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important}}
    .slide{font-family:"Nunito",sans-serif;color:var(--ink);background:#f6f5f0}.rule{position:absolute;left:96px;right:96px;top:88px;height:8px;background:var(--ink)}.red{position:absolute;left:96px;top:88px;width:360px;height:8px;background:var(--red)}.meta{position:absolute;right:96px;top:120px;font:700 24px "Nunito";text-align:right}.index{position:absolute;left:96px;top:170px;font:800 180px/1 "Archivo";color:var(--red)}h1{position:absolute;left:96px;bottom:170px;width:1200px;font:800 118px/.95 "Archivo";letter-spacing:0}.sub{position:absolute;right:96px;bottom:176px;width:440px;font:700 34px/1.28 "Nunito";color:#333}.circle{position:absolute;right:210px;top:280px;width:320px;height:320px;border:36px solid var(--blue);border-radius:50%}.block{position:absolute;right:420px;top:540px;width:310px;height:90px;background:var(--red)}
  </style>
</head>
<body><div class="deck-viewport"><main id="deckStage" class="deck-stage"><section class="slide active visible"><div class="rule"></div><div class="red"></div><div class="meta">Demo Judges<br>4:00 Pitch</div><div class="index">01</div><div class="circle"></div><div class="block"></div><h1>Mercedes EV Intelligent Driving Assistant</h1><div class="sub">A central agent connecting route, fatigue, battery, and memory.</div></section></main></div><script>const s=document.getElementById("deckStage");function scale(){const f=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;}addEventListener("resize",scale);scale();</script></body>
</html>
