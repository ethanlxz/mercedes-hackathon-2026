<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Night</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root{--stage-bg:#0d0d0d;--slide-bg:#181818;--orange:#ff5722;--text:#fff;--muted:#a8a8a8}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg)}.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg)}.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg)}.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg)}.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}img,video,canvas,svg{max-width:100%;max-height:100%}.deck-controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000}@media print{html,body{width:1920px;height:auto;overflow:visible;background:#fff}.deck-viewport{position:static;overflow:visible;background:#fff}.deck-stage{position:static;width:auto;height:auto;transform:none!important;background:none}.slide{position:relative;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;width:1920px;height:1080px;break-after:page;page-break-after:always}.slide:last-child{break-after:auto;page-break-after:auto}.deck-controls{display:none!important}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important}}
    .slide{font-family:"Space Grotesk",sans-serif;color:var(--text);background:linear-gradient(135deg,#161616,#242424 48%,#111)}.card{position:absolute;left:90px;top:86px;width:760px;height:908px;background:var(--orange);color:#161616;padding:56px}.num{font:700 40px "Space Grotesk"}.card h1{position:absolute;left:56px;bottom:56px;width:640px;font:400 88px/.92 "Archivo Black";letter-spacing:0}.side{position:absolute;left:980px;top:230px;width:720px}.side h2{font:400 86px/.95 "Archivo Black"}.side p{margin-top:34px;color:var(--muted);font-size:34px;line-height:1.35}.chips{display:flex;gap:18px;margin-top:54px}.chip{border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:18px 24px;font-weight:700}.line{position:absolute;right:90px;bottom:90px;width:650px;height:10px;background:var(--orange)}
  </style>
</head>
<body><div class="deck-viewport"><main id="deckStage" class="deck-stage"><section class="slide active visible"><div class="card"><div class="num">01 / 08</div><h1>Mercedes EV Intelligent Driving Assistant</h1></div><div class="side"><h2>One agent. One journey state.</h2><p>Trip planning, fatigue intervention, charging, and preference memory stop behaving like separate tools.</p><div class="chips"><div class="chip">Route-aware</div><div class="chip">Human-in-loop</div><div class="chip">Personal</div></div></div><div class="line"></div></section></main></div><script>const s=document.getElementById("deckStage");function scale(){const f=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;}addEventListener("resize",scale);scale();</script></body>
</html>
