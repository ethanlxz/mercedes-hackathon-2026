<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarPlay Routes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="bg-neutral-950 text-white">
    <main class="carplay-shell">
      <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Open sidebar">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div id="sidebar-scrim" class="sidebar-scrim hidden" aria-hidden="true"></div>

      <aside id="side-rail" class="side-rail" aria-hidden="true">
        <div class="sidebar-header">
          <div id="clock" class="clock">4:02</div>
          <button id="sidebar-close" class="sidebar-close" type="button" aria-label="Close sidebar">Close</button>
        </div>

        <nav class="sidebar-actions" aria-label="Navigation tools">
          <button id="gps-app-button" class="sidebar-action active" type="button">GPS</button>
          <button id="planner-app-button" class="sidebar-action" type="button">Trip Planner</button>
          <button id="edit-tags-button" class="sidebar-action" type="button">Edit Tags</button>
          <button id="settings-app-button" class="sidebar-action" type="button">Settings</button>
        </nav>
      </aside>

      <section class="map-stage" aria-label="Route map">
        <div id="map" class="map-canvas"></div>
        <div class="map-tint" aria-hidden="true"></div>
        <div id="pin-hover-card" class="pin-hover-card hidden" aria-hidden="true"></div>

        <form id="route-form" class="route-card" autocomplete="off">
          <div id="simple-route-panel">
            <label class="field-label" for="origin">Origin</label>
            <input
              id="origin"
              name="origin"
              class="route-input"
              type="text"
              placeholder="Optional: uses Current Location or Home"
              value=""
            />

            <label class="field-label" for="destination">Destination</label>
            <input
              id="destination"
              name="destination"
              class="route-input"
              type="text"
              placeholder="Penang"
              value="Penang"
            />

            <div class="route-actions">
              <button id="route-button" class="go-button" type="submit">Go</button>
              <p id="status" class="status-text" role="status"></p>
            </div>
          </div>

          <div id="planner-panel" class="hidden">
            <label class="field-label" for="trip-instruction">Trip Planner</label>
            <textarea
              id="trip-instruction"
              class="route-input trip-input"
              placeholder="Start at home, pick up my friend in Subang Jaya, grab dinner, then return home avoiding tolls."
            ></textarea>

            <div class="planner-actions">
              <button id="trip-button" class="go-button" type="button">Plan</button>
            </div>

            <p id="planner-status" class="status-text planner-status" role="status"></p>
          </div>

          <div id="tags-panel" class="hidden">
            <label class="field-label">Edit Tags</label>

            <div class="tag-grid">
              <div class="tag-box tag-box-home">
                <div class="tag-box-heading">Home</div>
                <input
                  id="home-address"
                  class="route-input tag-address-input"
                  type="text"
                  placeholder="Impian Meridian"
                />
                <button id="save-home-button" class="tag-save-button" type="button">Submit</button>
              </div>

              <div class="tag-box tag-box-work">
                <div class="tag-box-heading">Work</div>
                <input
                  id="work-address"
                  class="route-input tag-address-input"
                  type="text"
                  placeholder="Mont Kiara, Kuala Lumpur"
                />
                <button id="save-work-button" class="tag-save-button" type="button">Submit</button>
              </div>
            </div>

            <p id="tags-status" class="status-text planner-status" role="status"></p>
          </div>

          <div id="settings-panel" class="hidden">
            <label class="field-label">Settings</label>

            <div class="settings-box">
              <div class="settings-box-heading">Current Location</div>
              <input
                id="current-location-input"
                class="route-input tag-address-input"
                type="text"
                placeholder="Impian Meridian"
              />
              <button id="save-current-location-button" class="tag-save-button" type="button">
                Submit
              </button>
              <div class="resolved-location">
                <span>Resolved address</span>
                <strong id="current-location-display">Not set</strong>
              </div>
            </div>

            <p id="settings-status" class="status-text planner-status" role="status"></p>
          </div>
        </form>


        <div class="bottom-pill">
          <div>
            <strong id="arrival-time">--:--</strong>
            <span>arrival</span>
          </div>
          <div>
            <strong id="duration-text">--</strong>
            <span>duration</span>
          </div>
          <div>
            <strong id="distance-text">--</strong>
            <span>distance</span>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
