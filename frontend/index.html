<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarPlay Routes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="bg-neutral-950 text-white">
    <main class="carplay-shell">
      <aside class="side-rail">
        <div>
          <div id="clock" class="clock">4:02</div>
          <div class="signal-row" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <strong>5G</strong>
          </div>
          <div class="battery" aria-hidden="true"><span></span></div>
        </div>

        <nav class="app-stack" aria-label="CarPlay apps">
          <button id="planner-app-button" class="app-icon planner-icon" type="button" title="Trip Planner">
            <span></span><span></span><span></span>
          </button>
          <button class="app-icon podcast-icon" type="button" title="Podcasts">
            <span></span>
          </button>
          <button class="app-icon messages-icon" type="button" title="Messages">
            <span></span>
            <i></i>
          </button>
        </nav>

        <button class="dashboard-button" type="button" title="Dashboard">
          <span></span><span></span>
        </button>
      </aside>

      <section class="map-stage" aria-label="Route map">
        <div id="map" class="map-canvas"></div>
        <div class="map-tint" aria-hidden="true"></div>

        <form id="route-form" class="route-card" autocomplete="off">
          <div id="simple-route-panel">
            <label class="field-label" for="origin">Origin</label>
            <input
              id="origin"
              name="origin"
              class="route-input"
              type="text"
              placeholder="Kuala Lumpur"
              value="Kuala Lumpur"
            />

            <label class="field-label" for="destination">Destination</label>
            <input
              id="destination"
              name="destination"
              class="route-input"
              type="text"
              placeholder="Penang"
              value="Penang"
            />

            <div class="route-actions">
              <button id="route-button" class="go-button" type="submit">Go</button>
              <p id="status" class="status-text" role="status"></p>
            </div>
          </div>

          <div id="planner-panel" class="hidden">
            <label class="field-label" for="trip-instruction">Trip Planner</label>
            <textarea
              id="trip-instruction"
              class="route-input trip-input"
              placeholder="Start at home, pick up my friend in Subang Jaya, grab dinner, then return home avoiding tolls."
            ></textarea>

            <div class="planner-actions">
              <button id="trip-button" class="go-button" type="button">Plan</button>
              <button id="add-tags-button" class="secondary-button" type="button">Add Tags</button>
            </div>

            <div id="tag-panel" class="tag-panel hidden">
              <label class="field-label" for="tag-select">Tag</label>
              <select id="tag-select" class="route-input tag-select">
                <option value="home">Home</option>
                <option value="work">Work</option>
              </select>

              <label class="field-label" for="tag-address">Address</label>
              <input
                id="tag-address"
                class="route-input"
                type="text"
                placeholder="Shah Alam, Selangor"
              />

              <button id="save-tag-button" class="secondary-button save-tag-button" type="button">
                Save Tag
              </button>
              <div id="current-tags" class="current-tags"></div>
            </div>

            <p id="planner-status" class="status-text planner-status" role="status"></p>
          </div>
        </form>


        <div class="bottom-pill">
          <div>
            <strong id="arrival-time">--:--</strong>
            <span>arrival</span>
          </div>
          <div>
            <strong id="duration-text">--</strong>
            <span>duration</span>
          </div>
          <div>
            <strong id="distance-text">--</strong>
            <span>distance</span>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
